# Three service variants share the same image build, differing only in how the
# GPU is exposed to the container. Pick one:
#
#   Ultra-light (viewer):    docker compose --profile ultralight up cim-ultralight
#   CPU (default, no GPU):   docker compose up cim
#   NVIDIA CUDA:             docker compose --profile cuda up cim-cuda
#   AMD ROCm:                docker compose --profile rocm up cim-rocm
#
# The ultra-light service builds a tiny image with none of the ML/CV stack —
# just enough to browse a library and read/write metadata. Optional features
# hide themselves at runtime (see optional_deps.py + capabilities.py).
#
# The GPU services build the image with the matching accelerator wheels
# (GPU_BACKEND build arg) AND grant the container access to the device. Both are
# required: wheels alone can't see a GPU the container isn't given, and device
# access alone does nothing without the GPU build of torch/onnxruntime.

x-common: &common
  ports:
    - "8000:8000"
  volumes:
    - ./media:/app/media
    - ./data:/app/data
    - ./logs:/app/logs
    - ./models:/app/models
    - ./app_config.json:/app/app_config.json
  restart: unless-stopped

services:
  # ── Ultra-light (image viewer only) ────────────────────────────────────────
  # Bare minimum: gallery, UI, viewer, and the core modules (auth,
  # capabilities, cimlogger, metadata, threading). No torch / no ML / no CV.
  # Smallest image and fastest build. Everything heavy hides itself at runtime.
  cim-ultralight:
    <<: *common
    profiles: ["ultralight"]
    build:
      context: .
      args:
        GPU_BACKEND: ultralight

  # ── CPU (default) ──────────────────────────────────────────────────────────
  cim:
    <<: *common
    build:
      context: .
      args:
        GPU_BACKEND: cpu

  # ── NVIDIA CUDA ────────────────────────────────────────────────────────────
  # Requires the NVIDIA Container Toolkit on the host.
  cim-cuda:
    <<: *common
    profiles: ["cuda"]
    build:
      context: .
      args:
        GPU_BACKEND: cuda
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # - CIM_DEVICE=cuda   # uncomment to force CUDA regardless of detection
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── AMD ROCm ───────────────────────────────────────────────────────────────
  # Requires ROCm drivers on the host. The container needs the kfd + dri devices
  # and the video/render groups to talk to the GPU.
  cim-rocm:
    <<: *common
    profiles: ["rocm"]
    build:
      context: .
      args:
        GPU_BACKEND: rocm
    environment:
      - CIM_INSIGHT_ALLOW_MIGRAPHX=1
      # - CIM_DEVICE=rocm   # uncomment to force ROCm regardless of detection
      # - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-}
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp:unconfined
    ipc: host
    shm_size: "8gb"