<!-- The gallery, as a modal.

         Both the Gallery tab and the Albums tab drive this same modal, so there
         is exactly ONE gallery grid in the DOM (#gallery_grid). That matters:
         every existing feature — tile rendering, lazy-load IntersectionObserver,
         multi-select, bulk actions, pagination, comics — keeps addressing the
         same element it always did, so none of it needed rewriting.

         In "gallery" mode the folder picker and upload dropzone are shown, as
         before. In "album" mode they're hidden (an album is a flat set spanning
         folders, so a folder filter would be meaningless) and an album header
         with a Remove-from-album action takes their place. -->
    <div id="gallery_modal"
      class="hidden fixed inset-0 z-40 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">

      <div class="bg-gray-900 border border-gray-700 rounded-lg shadow-2xl w-full h-full max-w-[1400px] flex flex-col overflow-hidden">

        <!-- modal title bar -->
        <div class="flex items-center gap-3 px-4 py-3 bg-gray-800 border-b border-gray-700 flex-shrink-0">
          <h2 id="gallery_modal_title" class="text-lg font-bold text-blue-400 truncate">Gallery</h2>
          <span id="gallery_modal_sub" class="text-xs text-gray-400 truncate"></span>
          <button onclick="closeGalleryModal()"
            class="ml-auto text-sm bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded font-bold">✕ Close</button>
        </div>

        <!-- album-mode header: only shown when the modal was opened from an album -->
        <div id="gallery_album_bar"
          class="hidden items-center gap-2 px-4 py-2 bg-purple-900/40 border-b border-purple-800 flex-shrink-0 text-xs">
          <span class="text-purple-200">Viewing album</span>
          <span id="gallery_album_name" class="font-bold text-white"></span>
          <button onclick="albumRemoveSelected()" title="Remove the selected images from this album"
            class="ml-auto bg-rose-700 hover:bg-rose-600 px-2 py-1 rounded font-bold text-white">Remove selected from
            album</button>
          <button onclick="albumSetCoverSelected()" title="Use the selected image as this album's cover"
            class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded font-bold text-white">Set as cover</button>
        </div>

        <!-- search / folder / comic row (folder + comic hidden in album mode) -->
        <div class="px-4 py-2 bg-gray-800 border-b border-gray-700 flex gap-2 flex-shrink-0">
          <select id="folder_select" onchange="onFolderChange()"
            class="bg-gray-700 rounded border border-gray-600 text-sm text-white px-2 max-w-[34%]">
            <option value="">All folders</option>
          </select>
          <input id="search_input" type="text"
            placeholder="Search…  try: height:<512  is:untagged  ·  sem:red car at night (semantic)"
            class="flex-1 p-2 bg-gray-700 rounded border border-gray-600 text-sm text-white focus:border-blue-500">
          <button id="btn_make_comic" onclick="makeComic()" title="Package the current folder as a comic" data-feature="comics.make"
            class="text-xs bg-purple-700 hover:bg-purple-600 px-2 rounded font-bold whitespace-nowrap">📚 Make
            comic</button>
        </div>

        <!-- Bulk action bar — shown only when items are selected -->
        <div id="bulk_bar"
          class="hidden px-4 py-2 bg-gray-750 border-b border-gray-600 flex items-center gap-2 flex-shrink-0 flex-wrap">
          <span id="bulk_count" class="text-xs font-bold text-blue-300 mr-1"></span>
          <input id="bulk_tag_input" type="text" placeholder="Add tag(s), comma-separated, then Enter"
            class="flex-1 min-w-[160px] bg-gray-700 text-xs px-2 py-1.5 rounded border border-gray-600 text-white focus:border-blue-400"
            onkeydown="if(event.key==='Enter') applyBulkTag()">
          <button onclick="applyBulkTag()" data-feature="annot.tags"
            class="text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded font-bold">Tag</button>
          <!-- Album membership for the current selection -->
          <button onclick="addSelectedToAlbum()" title="Add every selected image to an album" data-feature="tab.albums.edit"
            class="text-xs bg-fuchsia-700 hover:bg-fuchsia-600 px-3 py-1.5 rounded font-bold">📁 Add to album</button>
          <button onclick="bulkDelete()" data-feature="data.delete" class="text-xs bg-red-700 hover:bg-red-600 px-3 py-1.5 rounded font-bold">🗑
            Delete</button>
          <button onclick="bulkBox()" data-feature="ai.autotag" title="Run AI box detection on every selected image"
            class="text-xs bg-teal-700 hover:bg-teal-600 px-3 py-1.5 rounded font-bold">🤖 AI Box</button>
          <button onclick="bulkSegment()" data-feature="ai.segment" title="Run the background segmentation (YOLO-seg) model on every selected image, adding masked regions for the whitelisted classes"
            class="text-xs bg-fuchsia-700 hover:bg-fuchsia-600 px-3 py-1.5 rounded font-bold">🎭 Segment</button>
          <button onclick="bulkPose()" data-feature="ai.pose" title="Estimate a skeleton/pose on every selected image and store it — this is what T-pose aggregation reads, so run it over a person's images before Estimate T-pose"
            class="text-xs bg-cyan-700 hover:bg-cyan-600 px-3 py-1.5 rounded font-bold">🦴 Pose</button>
          <select id="bulk_action_select" title="AI action to run on each selected image"
            class="text-xs bg-gray-700 text-white rounded border border-gray-600 px-1 py-1.5 max-w-[130px]"></select>
          <button onclick="bulkRunAI()" data-feature="ai.llm" title="Run the chosen AI action on every selected image"
            class="text-xs bg-yellow-600 hover:bg-yellow-500 px-3 py-1.5 rounded font-bold">✨ Run AI</button>
          <button onclick="bulkPipeline()" data-feature="ai.smarttag" title="Run the full Smart Tag pipeline on every selected image"
            class="text-xs bg-teal-600 hover:bg-teal-500 px-3 py-1.5 rounded font-bold">🌳 Smart Tag</button>
          <button onclick="bulkEmbed()" title="Generate/regenerate embeddings for every selected image (OAI endpoint if configured, else local)"
            class="text-xs bg-purple-700 hover:bg-purple-600 px-3 py-1.5 rounded font-bold">🧬 Embed selected</button>
          <button onclick="clearSelection()"
            class="text-xs bg-gray-600 hover:bg-gray-500 px-3 py-1.5 rounded ml-auto">✕
            Deselect</button>
        </div>

        <div id="dropzone" data-feature="upload.manual"
          class="mx-4 mt-3 mb-1 border-2 border-dashed border-gray-600 rounded-lg p-4 text-center text-gray-400 flex flex-col items-center bg-gray-800 flex-shrink-0">
          <p class="font-bold text-sm">Drag & Drop Images</p>
          <p class="text-xs text-gray-500">Stored as lossless .JXL</p>
          <div class="mt-2 flex items-center gap-2">
            <input id="upload_folder" type="text" placeholder="folder (opt)"
              class="bg-gray-700 text-xs px-2 py-1 rounded border border-gray-600 w-28">
            <button onclick="document.getElementById('file_input').click()"
              class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-xs font-bold">Browse</button>
          </div>
          <input id="file_input" type="file" multiple class="hidden">
        </div>

        <!-- Pagination bar -->
        <div class="flex items-center gap-2 px-4 py-2 flex-shrink-0 text-xs text-gray-400">
          <button id="btn_prev" onclick="changePage(-1)"
            class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded disabled:opacity-30">◀ Prev</button>
          <span id="page_info">Page 1</span>
          <button id="btn_next" onclick="changePage(1)"
            class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded disabled:opacity-30">Next ▶</button>
          <span class="ml-auto" id="showing_info"></span>
        </div>

        <div id="filter_banner"
          class="hidden items-center gap-2 mx-4 mb-2 px-3 py-1.5 rounded bg-purple-900/50 border border-purple-700 text-xs text-purple-200">
          <span id="filter_banner_text"></span>
          <button onclick="clearImageFilter()"
            class="ml-auto bg-purple-700 hover:bg-purple-600 px-2 py-0.5 rounded text-white">Clear ✕</button>
        </div>

        <div class="flex-1 overflow-y-auto px-4 pb-2" id="gallery_scroll">
          <div id="gallery_grid" class="masonry"></div>
        </div>
      </div>
    </div>
