    <div id="music_pane" class="hidden absolute inset-0 z-20 bg-gray-900 text-white flex flex-col">
      <!-- toolbar -->
      <div class="p-3 bg-gray-800 border-b border-gray-700 flex items-center gap-2 flex-wrap flex-shrink-0">
        <div class="flex rounded overflow-hidden border border-gray-600 text-xs font-bold">
          <button id="mm_back" onclick="setMode('images')" class="px-3 py-1 bg-gray-700 hover:bg-gray-600">←
            Images</button>
          <button id="mm_music" class="px-3 py-1 bg-blue-600">Music</button>
        </div>
        <div class="flex rounded overflow-hidden border border-gray-600 text-xs font-bold ml-2">
          <button id="mtab_artists" onclick="musicView('artists')" class="px-3 py-1 bg-blue-600">Artists</button>
          <button id="mtab_albums" onclick="musicView('albums')"
            class="px-3 py-1 bg-gray-700 hover:bg-gray-600">Albums</button>
          <button id="mtab_songs" onclick="musicView('songs')"
            class="px-3 py-1 bg-gray-700 hover:bg-gray-600">Songs</button>
          <button id="mtab_clusters" onclick="musicView('clusters')"
            class="px-3 py-1 bg-gray-700 hover:bg-gray-600">Clusters</button>
        </div>
        <input id="music_search" type="text" placeholder="Search title / artist / album / genre / tag…"
          oninput="musicSearchDebounced()"
          class="flex-1 min-w-[180px] bg-gray-700 rounded border border-gray-600 text-sm px-3 py-1">
        <button onclick="musicReindex()" title="Scan media folder for audio (resumable)"
          class="text-xs bg-indigo-600 hover:bg-indigo-500 font-bold px-2 py-1.5 rounded">Reindex</button>
        <button onclick="musicEmbed()" title="Generate audio embeddings for clustering & shuffle"
          class="text-xs bg-purple-700 hover:bg-purple-600 font-bold px-2 py-1.5 rounded">Embed</button>
        <button onclick="musicCluster()" title="Cluster tracks by sound"
          class="text-xs bg-purple-800 hover:bg-purple-700 font-bold px-2 py-1.5 rounded">Cluster</button>
        <span id="music_stat" class="text-xs text-gray-400">—</span>
      </div>

      <div class="flex flex-1 overflow-hidden">
        <!-- list -->
        <div id="music_list" class="flex-1 overflow-auto p-3"></div>
        <!-- detail / editor -->
        <div id="music_detail" class="w-[360px] border-l border-gray-700 bg-gray-850 overflow-auto p-4 hidden">
        </div>
      </div>

      <!-- player bar -->
      <div id="music_player_bar"
        class="hidden flex-shrink-0 bg-gray-800 border-t border-gray-700 p-2 flex items-center gap-3">
        <div class="flex-1 min-w-0">
          <div id="np_title" class="text-sm font-bold truncate">—</div>
          <div id="np_sub" class="text-xs text-gray-400 truncate">—</div>
        </div>
        <button onclick="playPrev()" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">⏮</button>
        <button onclick="playNext()" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">⏭</button>
        <button id="shuffle_song_btn" onclick="shuffleByCurrent('song')" title="Shuffle by this song's sound"
          class="text-xs bg-emerald-700 hover:bg-emerald-600 font-bold px-2 py-1 rounded">Shuffle by song</button>
        <button id="shuffle_artist_btn" onclick="shuffleByCurrent('artist')" title="Shuffle by this artist's sound"
          class="text-xs bg-emerald-800 hover:bg-emerald-700 font-bold px-2 py-1 rounded">Shuffle by artist</button>
        <audio id="audio_el" controls class="h-8"></audio>
      </div>
    </div>
