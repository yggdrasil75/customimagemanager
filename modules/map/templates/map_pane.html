<!-- Tab: Map. Every geotagged file as a clustered thumbnail marker. Clicking a
     marker opens the file in the editor (selectFile), exactly like a gallery
     tile. "Show in gallery" puts a bbox: token for the visible area into the
     gallery search. The date range and "Gallery search" switch scope the
     markers (/api/map/points?from=&to=&q=...). Filled by modules/map/static/map.js. -->
<div id="map_pane" class="hidden flex-1 flex flex-col overflow-hidden">
  <div class="px-3 py-2 bg-gray-800 border-b border-gray-700 flex flex-wrap gap-2 items-center flex-shrink-0 text-xs">
    <span id="map_count" class="text-gray-400">...</span>
    <span id="map_scan" class="text-gray-500"></span>
    <span class="flex-1"></span>
    <label class="flex items-center gap-1 text-gray-400" title="Only files taken in this date range">
      From <input type="date" id="map_from" onchange="mapFilterChanged()"
        class="bg-gray-700 border border-gray-600 rounded px-1 py-0.5 text-gray-200">
    </label>
    <label class="flex items-center gap-1 text-gray-400">
      to <input type="date" id="map_to" onchange="mapFilterChanged()"
        class="bg-gray-700 border border-gray-600 rounded px-1 py-0.5 text-gray-200">
    </label>
    <button type="button" onclick="mapClearDates()" title="Clear the date range"
      class="bg-gray-700 hover:bg-gray-600 rounded px-2 py-1 text-gray-200">&times;</button>
    <label class="flex items-center gap-1 text-gray-300 cursor-pointer"
      title="Show only what the gallery's current search / folder / album lists">
      <input type="checkbox" id="map_use_search" onchange="mapFilterChanged()" class="accent-blue-500">
      Gallery search
    </label>
    <button type="button" onclick="mapShowInGallery()" title="Filter the gallery to the area on screen"
      class="bg-gray-700 hover:bg-gray-600 rounded px-2 py-1 text-gray-200">Show in gallery</button>
    <button type="button" onclick="mapFitAll()" title="Zoom to show every geotagged file"
      class="bg-gray-700 hover:bg-gray-600 rounded px-2 py-1 text-gray-200">Fit all</button>
    <button type="button" onclick="mapRescan()" id="map_rescan_btn"
      title="Re-read GPS from every file and sidecar"
      class="bg-gray-700 hover:bg-gray-600 rounded px-2 py-1 text-gray-200">Rescan</button>
  </div>
  <div id="map_canvas" class="flex-1 min-h-0 relative"></div>
</div>
