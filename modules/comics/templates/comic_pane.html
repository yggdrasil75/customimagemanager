{# Comic reader: a centre-pane media mode (like the book reader and the
   person mesh). Shown via setMediaMode('comic'); metadata lives in the
   controls pane's Comic tab (comic_editor.html). #}
<div id="comic_pane" class="hidden flex-1 flex flex-col bg-gray-900 min-w-0">
  <div class="flex items-center gap-3 px-3 py-1.5 bg-gray-800 border-b border-gray-700 flex-shrink-0">
    <button onclick="closeComic()" title="Back to images" class="text-gray-400 hover:text-white text-sm">‹ Back</button>
    <span class="text-purple-300 font-bold truncate" id="comic_title_h">Comic</span>
    <span id="comic_kind_badge" class="text-[10px] px-1.5 rounded bg-gray-700 text-gray-300"></span>
    <span id="comic_pageinfo" class="text-xs text-gray-400"></span>
    <div class="ml-auto flex gap-2 items-center">
      <span data-ext-area="comic_tools" class="contents"></span>
      <button onclick="comicPipeline()" data-feature="ai.smarttag" data-comic-kind="folder"
        class="text-xs bg-teal-600 hover:bg-teal-500 px-3 py-1 rounded font-bold">✨ Smart Tag</button>
      <button onclick="comicBoxAll()" data-feature="ai.autotag" data-comic-kind="folder"
        class="text-xs bg-teal-700 hover:bg-teal-600 px-3 py-1 rounded font-bold">📦 Box all pages</button>
    </div>
  </div>
  <div class="flex-1 flex flex-col overflow-hidden">
    <div id="comic_view" class="flex-1 overflow-auto bg-black flex items-center justify-center relative">
      <img id="comic_page_img" class="max-h-full max-w-full object-contain" alt="">
      <button onclick="comicPage(-1)"
        class="absolute left-2 top-1/2 -translate-y-1/2 bg-gray-800/70 hover:bg-gray-700 px-3 py-2 rounded text-2xl">‹</button>
      <button onclick="comicPage(1)"
        class="absolute right-2 top-1/2 -translate-y-1/2 bg-gray-800/70 hover:bg-gray-700 px-3 py-2 rounded text-2xl">›</button>
    </div>
    <div id="comic_strip"
      class="h-20 flex gap-1 overflow-x-auto bg-gray-900 border-t border-gray-700 p-1 flex-shrink-0"></div>
  </div>
</div>
