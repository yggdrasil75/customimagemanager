<!-- Movies pane - the left-column browser for the movies section.

     A toolbar (search, sort, the declared Reindex button in its ext area), the
     poster grid and a pager. Picking a movie hands it to the core's viewer
     (selectFile): the video plays in the centre as any clip does, with the
     movie's subtitles attached as tracks. -->
<div id="movies_pane" class="hidden flex-1 bg-gray-900 text-white flex flex-col overflow-hidden">

  <div class="p-3 bg-gray-800 border-b border-gray-700 flex items-center gap-2 flex-wrap flex-shrink-0">
    <input id="movies_search" type="text" placeholder="Search title / plot / genre / year..."
      oninput="moviesSearchDebounced()"
      class="flex-1 min-w-[160px] bg-gray-700 rounded border border-gray-600 text-sm px-3 py-1">
    <select id="movies_sort" onchange="moviesSortChanged()" title="Sort"
      class="bg-gray-700 rounded border border-gray-600 text-xs px-1 py-1">
      <option value="title">Title</option>
      <option value="year">Year</option>
      <option value="added">Recently added</option>
      <option value="path">Path</option>
    </select>
    <button id="movies_sort_dir" onclick="moviesToggleDir()" title="Ascending"
      class="bg-gray-700 hover:bg-gray-600 rounded border border-gray-600 text-xs px-2 py-1">&#8593;</button>
  </div>

  <div class="px-3 py-1.5 bg-gray-850 border-b border-gray-700 flex items-center gap-2 flex-wrap
              flex-shrink-0 text-[10px]">
    <span data-ext-area="movies_tools" class="flex items-center gap-1"></span>
    <select id="movies_genre" onchange="moviesReload()" title="Genre"
      class="bg-gray-700 rounded border border-gray-600 text-[10px] px-1 py-0.5">
      <option value="">All genres</option>
    </select>
    <span id="movies_stat" class="text-gray-400">-</span>
  </div>

  <div id="movies_detail" class="hidden flex-shrink-0 border-b border-gray-800 p-3 text-xs"></div>

  <div class="flex flex-1 overflow-hidden">
    <div id="movies_list" class="flex-1 overflow-auto p-3"></div>
  </div>

  <div id="movies_pager"
    class="hidden flex-shrink-0 bg-gray-800 border-t border-gray-700 p-2 flex items-center justify-center gap-3 text-xs">
    <button onclick="moviesPage(-1)" class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">Prev</button>
    <span id="movies_page_label" class="text-gray-400">-</span>
    <button onclick="moviesPage(1)" class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded">Next</button>
  </div>
</div>
