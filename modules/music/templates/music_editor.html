<!-- Track-mode controls pane: the tags of the track in the player.

     Body only: the core wraps this in #controls_pane_music
     (register_controls_pane). Fields carry data-mk; the metadata-source
     lookup (metasrc) reads and fills them inside #music_detail, so keep that id. -->
<div id="music_detail" class="flex flex-col gap-2">
  <div class="flex justify-between items-center gap-2">
    <span class="text-sm font-bold text-gray-300">Track</span>
    <div id="music_detail_actions" class="hidden flex items-center gap-1">
      <span data-ext-area="music_tools" class="flex items-center gap-1"></span>
      <button onclick="musicSimilarTo(musicEditRel())" title="Tracks that sound like this"
        class="text-[10px] bg-indigo-700 hover:bg-indigo-600 px-2 py-1 rounded text-white uppercase font-bold">Similar</button>
      <a id="music_download" href="#" download
        class="text-[10px] bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded uppercase font-bold">Download</a>
    </div>
  </div>

  <div id="music_detail_empty" class="text-xs text-gray-500">Play or pick a track to see its tags.</div>

  <div id="music_detail_body" class="hidden flex flex-col gap-2">
    <!-- format strip -->
    <div class="flex items-center gap-2 text-[10px] flex-wrap">
      <span id="mt_fmt" class="px-1.5 py-0.5 rounded bg-gray-700 text-gray-200 font-mono uppercase">-</span>
      <span id="mt_tech" class="text-gray-500"></span>
      <span id="mt_emb" class="ml-auto"></span>
    </div>
    <div id="mt_path" class="text-[10px] text-gray-500 break-all"></div>
    <div id="mt_video" class="hidden text-[10px] text-pink-400 break-all" title="This track's music video"></div>
    <input type="hidden" data-mk="rel_path">

    <div class="border-t border-gray-800 pt-2 grid grid-cols-6 gap-x-2 gap-y-1.5 text-xs">
      <label class="col-span-6 flex flex-col gap-0.5"><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Title</span>
        <input data-mk="title" type="text" class="bg-gray-700 rounded border border-gray-600 px-2 py-1"></label>
      <label class="col-span-3 flex flex-col gap-0.5"><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Artist</span>
        <input data-mk="artist" type="text" class="bg-gray-700 rounded border border-gray-600 px-2 py-1"></label>
      <label class="col-span-3 flex flex-col gap-0.5"><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Album artist</span>
        <input data-mk="albumartist" type="text" class="bg-gray-700 rounded border border-gray-600 px-2 py-1"></label>
      <label class="col-span-6 flex flex-col gap-0.5"><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Album</span>
        <input data-mk="album" type="text" class="bg-gray-700 rounded border border-gray-600 px-2 py-1"></label>
      <label class="col-span-2 flex flex-col gap-0.5"><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Track</span>
        <input data-mk="track" type="number" min="0" class="bg-gray-700 rounded border border-gray-600 px-2 py-1"></label>
      <label class="col-span-2 flex flex-col gap-0.5"><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Disc</span>
        <input data-mk="disc" type="number" min="0" class="bg-gray-700 rounded border border-gray-600 px-2 py-1"></label>
      <label class="col-span-2 flex flex-col gap-0.5"><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Year</span>
        <input data-mk="year" type="text" class="bg-gray-700 rounded border border-gray-600 px-2 py-1"></label>
      <label class="col-span-3 flex flex-col gap-0.5"><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Genre</span>
        <input data-mk="genre" type="text" list="music_genre_list" class="bg-gray-700 rounded border border-gray-600 px-2 py-1"></label>
      <label class="col-span-3 flex flex-col gap-0.5"><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Composer</span>
        <input data-mk="composer" type="text" class="bg-gray-700 rounded border border-gray-600 px-2 py-1"></label>
      <label class="col-span-6 flex flex-col gap-0.5"><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Comment</span>
        <textarea data-mk="comment" rows="2" class="bg-gray-700 rounded border border-gray-600 px-2 py-1"></textarea></label>
      <label class="col-span-6 flex flex-col gap-0.5"><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Tags (comma-separated)</span>
        <input data-mk="tags" type="text" class="bg-gray-700 rounded border border-gray-600 px-2 py-1"></label>
    </div>
    <datalist id="music_genre_list"></datalist>

    <div class="flex items-center gap-2 mt-1">
      <button onclick="saveMusicMeta()"
        class="flex-1 bg-blue-600 hover:bg-blue-500 font-bold rounded py-1.5 text-sm">Save</button>
      <span id="mt_saved" class="text-[10px] text-gray-500"></span>
    </div>

    <div class="border-t border-gray-800 pt-2 text-[10px] text-gray-500 flex flex-col gap-1">
      <button onclick="musicFilterBy('artist', musicEditField('albumartist') || musicEditField('artist'))"
        class="text-left text-blue-400 hover:underline">All by this artist</button>
      <button onclick="musicFilterBy('album', musicEditField('album'), musicEditField('albumartist') || musicEditField('artist'))"
        class="text-left text-blue-400 hover:underline">The whole album</button>
    </div>
  </div>
</div>
