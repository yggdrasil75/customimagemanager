[pytest]
# Core tests live in tests/, module-owned tests in modules/<id>/tests/.
testpaths = tests modules
python_files = test_*.py
# importlib: two modules may both ship tests/test_module.py without clashing.
addopts = -q -rs --tb=short -p no:cacheprovider --import-mode=importlib
pythonpath = . tests
filterwarnings = ignore
norecursedirs = node_modules __pycache__ static templates fixtures .git
